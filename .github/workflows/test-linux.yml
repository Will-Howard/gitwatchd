name: test-linux

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: linux/go.mod
      - name: Configure git for the test suite
        run: |
          git config --global init.defaultBranch main
      - name: Run tests
        working-directory: linux
        run: go test -v ./...
      - name: Build static binaries
        working-directory: linux
        run: make build build-arm64
